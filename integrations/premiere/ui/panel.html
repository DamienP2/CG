<!-- 1 · Projects -->
<section id="scr-projects" class="scr">
  <header class="hd">
    <span class="logo">S</span><b class="ttl">Strata Graphics</b><span class="sp"></span>
    <span id="conn" class="conn"><i></i><span id="connTxt"></span></span>
    <button id="gear" class="ib" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
    </button>
  </header>
  <div class="bar">
    <input id="pSearch" class="grow" placeholder="Search projects…" />
    <button id="syncNow" class="ib round" title="Sync now">⟳</button>
  </div>
  <div id="projects" class="list"></div>
  <footer class="ft">
    <span id="srvTxt" class="ell"></span><span class="sp"></span>
    <span class="ft-l">Auto-sync</span><button id="autoSync" class="sw" title="Auto-sync"><i></i></button>
  </footer>
</section>

<!-- 2 · Templates -->
<section id="scr-templates" class="scr hidden">
  <header class="hd">
    <span class="logo">S</span><b id="projTitle" class="ttl"></b><span class="sp"></span>
    <button class="back" data-go="projects">‹ Projects</button>
  </header>
  <div class="bar wrap">
    <input id="tSearch" class="grow" placeholder="Search templates…" />
    <div id="zones" class="chips"></div>
  </div>
  <div id="templates" class="list tgrid"></div>
</section>

<!-- 3 · Clip -->
<section id="scr-clip" class="scr hidden">
  <header class="hd">
    <span class="logo">S</span><b id="tplTitle" class="ttl"></b><span class="sp"></span>
    <button id="backTpl" class="back" data-go="templates"></button>
  </header>
  <div class="clip">
    <div class="col">
      <div id="pv" class="pv"><iframe id="pvFrame" title="" tabindex="-1"></iframe></div>
      <div class="transport">
        <button id="play" class="ib" title="Play">▶</button>
        <button id="loop" class="ib on" title="Loop">⟲</button>
        <span id="pvTc" class="tc"></span>
      </div>
      <div class="blk">
        <div class="blk-h">
          <span class="cap">Durations</span><span class="sp"></span>
          <label class="tot"><span>Total</span><input id="total" type="number" min="0.1" max="300" step="0.1" /><i>s</i></label>
          <button id="origin" class="pill"></button>
        </div>
        <div id="tl" class="tl">
          <div id="ruler" class="ruler"></div>
          <div id="track" class="track"></div>
          <div id="labels" class="labels"></div>
          <div id="ph" class="ph"></div>
        </div>
      </div>
    </div>
    <div class="col">
      <div id="paramsCap" class="cap pad">Exposed parameters</div>
      <div id="fields" class="fields"></div>
    </div>
  </div>
  <footer class="ft act">
    <button id="update" class="btn primary hidden">Update clip</button>
    <button id="insert" class="btn primary" title="Insert at playhead">Insert</button>
  </footer>
</section>

<!-- 4 · Settings -->
<section id="scr-settings" class="scr hidden">
  <header class="hd">
    <span class="logo">S</span><b class="ttl">Settings</b><span class="sp"></span>
    <button class="back" data-go="projects">‹ Projects</button>
  </header>
  <div class="list set">
    <div class="cap pad">Server</div>
    <div class="rows">
      <label class="row"><span class="lab">URL</span><input id="server" class="grow" placeholder="http://strata-server:8080" spellcheck="false" /></label>
      <label class="row"><span class="lab">API key</span><input id="key" class="grow" type="password" placeholder="pcg_…" spellcheck="false" /><button id="paste" class="pill" type="button">Paste</button></label>
      <div class="row"><button id="test" class="pill">Test connection</button><span id="testState" class="state ell"></span></div>
    </div>
    <div class="cap pad">Sync</div>
    <div class="rows">
      <div class="row">
        <span class="lab">Auto-sync</span><button id="autoSync2" class="sw"><i></i></button>
        <select id="every">
          <option value="10">10 s</option>
          <option value="30">30 s</option>
          <option value="60">1 min</option>
          <option value="300">5 min</option>
        </select>
      </div>
      <div class="row"><span class="lab">Last</span><span id="lastAgo" class="val ell"></span><button id="syncNow2" class="pill">⟳ Now</button></div>
    </div>
    <div class="cap pad">Panel</div>
    <div class="rows">
      <div class="row"><span class="lab">Version</span><span id="ver" class="val ell"></span><span id="verState" class="state"></span></div>
      <div class="row"><span class="lab"></span><button id="check" class="pill">Check for updates</button></div>
    </div>
  </div>
</section>

<div id="toast" class="toast"></div>
