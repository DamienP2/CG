name: CI

on:
  # Branches only: a release tag runs the Release workflow (and its own checks).
  push:
    branches: ['**']
  pull_request:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The example renders load every core: they run on their own, after the
      # timing tests, so those measure the code and not a saturated runner.
      - run: cargo test --workspace -- --skip every_example_loads_and_renders
      - run: cargo test -p cg-server --bin cg-server every_example_loads_and_renders

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
