[package]
name = "cg-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cg-server"
path = "src/main.rs"

[features]
decklink = ["cg-output/decklink"]

[dependencies]
cg-core.workspace = true
cg-render.workspace = true
cg-output.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "net"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["mime-guess"] }
directories = "6"
if-addrs = "0.15"
gethostname = "1"
jiff = "0.2"
argon2 = "0.5"
uuid.workspace = true
rpassword = "7"
# Over-the-air updates: GitHub releases client and package extraction.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
roxmltree = "0.20"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
